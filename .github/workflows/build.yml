name: Build Survey to GHCR

run-name: "Build and push Survey images for ${{ github.ref_name }} by ${{ github.actor }}"

on:
  push:
    branches:
      - main
    paths:
      - 'frontend/**'
      - 'backend/**'
      - 'docker-compose.yaml'
      - 'docker-compose.prod.yaml'
      - '.github/workflows/build.yml'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/app/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend/app

      - name: Build frontend
        run: npm run build
        working-directory: frontend/app
        env:
          VITE_BACKEND_API_URL: /backend

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt

      - name: Validate backend imports
        run: python -m compileall -q backend/src

  build:
    runs-on: ubuntu-latest
    needs: test
    env:
      BASE_IMAGE: ghcr.io/${{ github.repository_owner }}/${{ github.event.repository.name }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and push frontend image
        env:
          VITE_LOGGING: ${{ vars.VITE_LOGGING || '0' }}
        run: |
          docker build \
            --target prod \
            --build-arg VITE_LOGGING="${VITE_LOGGING}" \
            --build-arg VITE_BACKEND_API_URL="/backend" \
            -t "${BASE_IMAGE}-frontend:latest" \
            -t "${BASE_IMAGE}-frontend:${GITHUB_SHA}" \
            ./frontend

          docker push "${BASE_IMAGE}-frontend:latest"
          docker push "${BASE_IMAGE}-frontend:${GITHUB_SHA}"

      - name: Build and push backend image
        run: |
          docker build \
            -t "${BASE_IMAGE}-backend:latest" \
            -t "${BASE_IMAGE}-backend:${GITHUB_SHA}" \
            ./backend

          docker push "${BASE_IMAGE}-backend:latest"
          docker push "${BASE_IMAGE}-backend:${GITHUB_SHA}"
